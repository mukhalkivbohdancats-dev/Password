name: Build Password APK with Gradle 8.6

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонування репозиторію
      uses: actions/checkout@v4

    - name: Налаштування Java JDK 17 (необхідно для Gradle 8.6)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Налаштування Android SDK
      uses: android-actions/setup-android@v3

    - name: Автоматична генерація Android-проєкту та інтеграція файлів
      run: |
        echo "Створення структури Android проєкту..."
        mkdir -p app/src/main/java/com/password/app
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/res/values

        # Копіювання ваших вебфайлів у папку assets додатка
        if [ -f "Index.html" ]; then cp Index.html app/src/main/assets/; fi
        if [ -f "index.html" ]; then cp index.html app/src/main/assets/Index.html; fi
        if [ -f "Index.js" ]; then cp Index.js app/src/main/assets/; fi
        if [ -f "index.js" ]; then cp index.js app/src/main/assets/Index.js; fi
        if [ -f "index.css" ]; then cp index.css app/src/main/assets/; fi
        if [ -f "Index.css" ]; then cp Index.css app/src/main/assets/index.css; fi

        # Налаштування конфігурації Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "PasswordStrength"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.0' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }

        android {
            namespace 'com.password.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.password.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # Маніфест додатку з дозволом на роботу з WebView
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="Password Strength"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # Java клас для запуску вебсторінки всередині додатка
        cat << 'EOF' > app/src/main/java/com/password/app/MainActivity.java
        package com.password.app;

        import android.os.Bundle;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webSettings.setDomStorageEnabled(true);
                webView.setWebViewClient(new WebViewClient());
                webView.loadUrl("file:///android_asset/Index.html");
                setContentView(webView);
            }
        }
        EOF

        echo "android.useAndroidX=true" > gradle.properties

        # Генерація Gradle Wrapper спеціально для версії 8.6
        gradle wrapper --gradle-version 8.6

    - name: Запуск збірки через Gradle 8.6
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Створення папки apk та збереження файлу
      run: |
        mkdir -p apk
        cp app/build/outputs/apk/debug/app-debug.apk apk/password.apk
        ls -la apk

    - name: Збереження файлу в артефакти GitHub
      uses: actions/upload-artifact@v4
      with:
        name: password-apk
        path: apk/password.apk

    - name: Автоматичний коміт папки apk та файлу password.apk у репозиторій
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add apk/password.apk
        git commit -m "Auto-generate password.apk via Gradle 8.6 [skip ci]" || echo "No changes"
        git push
